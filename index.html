<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Biblioteca — prototipo beta</title>
<style>
:root{--paper:#f4efe6;--paper2:#ebe1d2;--ink:#2d2925;--muted:#756d65;--line:#cabaa5;--accent:#745b47;--shadow:0 12px 28px rgb(59 43 30/.13);--r:18px;--cover:150px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(#f7f3ec,#eee4d7);color:var(--ink);font:18px/1.6 Georgia,"Times New Roman",serif}
button,a{font:inherit}a{color:inherit}.shell{max-width:1240px;margin:auto;padding:24px clamp(18px,4vw,52px) 70px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:10px 0 28px}.brand{font:600 15px/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}.tag{color:var(--muted);font:14px system-ui,sans-serif}
h1,h2,h3{font-weight:500;line-height:1.1}h1{font-size:clamp(42px,7vw,78px);margin:.1em 0 .25em}h2{font-size:clamp(29px,4vw,44px);margin:0}p{max-width:72ch}.lede{font-size:clamp(20px,2.3vw,28px);color:#504940;max-width:32ch;margin:0 0 46px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 40px;font:15px system-ui,sans-serif}.toolbar strong{margin-right:4px}.density{border:1px solid #b9aa98;background:#fff9f0;padding:9px 12px;border-radius:999px;cursor:pointer}.density[aria-pressed="true"]{background:#3c332d;color:white;border-color:#3c332d}
.shelf{margin:0 0 58px}.shelfHead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}.shelfHead a{text-decoration:none;border-bottom:1px solid transparent}.shelfHead a:hover,.shelfHead a:focus-visible{border-bottom-color:currentColor}.count{font:14px system-ui,sans-serif;color:var(--muted)}
.books{display:flex;gap:clamp(18px,2.5vw,34px);overflow-x:auto;overflow-y:hidden;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;padding:14px 8px 25px 4px;scrollbar-width:auto;scrollbar-color:#8c6e4e #e7dac9;cursor:grab;-webkit-overflow-scrolling:touch}.books:active{cursor:grabbing}.books::-webkit-scrollbar{height:12px}.books::-webkit-scrollbar-track{background:#e7dac9;border-radius:999px}.books::-webkit-scrollbar-thumb{background:#8c6e4e;border:3px solid #e7dac9;border-radius:999px}.books:focus-visible{outline:2px solid #745b47;outline-offset:5px}.books:after{content:"";min-width:8px}.shelfLine{height:14px;border-radius:3px;background:linear-gradient(#b99c77,#8c6e4e);box-shadow:0 7px 12px rgb(70 48 27/.18);margin-top:-16px}
.book{flex:0 0 var(--cover);scroll-snap-align:start;text-decoration:none;display:block}.cover{aspect-ratio:2/3;border-radius:3px 7px 7px 3px;box-shadow:var(--shadow);padding:16px 13px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}.book:hover .cover,.book:focus-visible .cover{transform:translateY(-7px);box-shadow:0 18px 34px rgb(59 43 30/.22)}.cover:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:rgb(0 0 0/.12)}.cover b{font-size:clamp(13px,1.3vw,18px);line-height:1.12}.cover small{font:11px/1.3 system-ui,sans-serif;letter-spacing:.04em}.bookTitle{font:14px/1.3 system-ui,sans-serif;margin:11px 0 0}.bookAuthor{font:12px/1.3 system-ui,sans-serif;color:var(--muted)}
.c1{background:#d6c19f}.c2{background:#9c8066;color:#fff}.c3{background:#c7b7ad}.c4{background:#e0d3bd}.c5{background:#6d6259;color:#fff}.c6{background:#d8c9b4}.c7{background:#a89a89;color:#fff}
.breadcrumbs{font:14px system-ui,sans-serif;color:var(--muted);margin:4px 0 30px}.breadcrumbs a{color:inherit}.bookNav{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}.bookNav a{display:inline-flex;align-items:center;gap:6px;border:1px solid #a9957c;border-radius:999px;padding:9px 13px;text-decoration:none;font:14px system-ui,sans-serif;background:#fffaf3}.bookNav a:hover,.bookNav a:focus-visible{background:#3c332d;color:#fff}.authorHero{display:grid;grid-template-columns:150px 1fr;gap:28px;align-items:start;margin-bottom:44px}.portrait{width:150px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e4d7c3,#a79582);display:grid;place-items:center;font:44px system-ui,sans-serif;color:#fff;box-shadow:var(--shadow)}
.openBook{display:grid;grid-template-columns:minmax(240px,330px) minmax(0,1fr);gap:clamp(28px,6vw,80px);align-items:start}.heroCover{width:min(100%,320px);margin:auto}.heroCover .cover{padding:28px 22px}.heroCover .cover b{font-size:28px}.bookMeta{font:14px system-ui,sans-serif;color:var(--muted);margin-bottom:22px}.bookCopy{font-size:20px}.flap{margin-top:34px;border-left:1px solid var(--line);padding:2px 0 2px 24px}.flap summary{cursor:pointer;font:600 14px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}.flapInner{display:grid;grid-template-columns:68px 1fr;gap:16px;margin-top:18px}.miniPortrait{width:68px;aspect-ratio:1;border-radius:50%;background:#b5a38e;display:grid;place-items:center;color:#fff;font:20px system-ui,sans-serif}.sources{margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}.sourceLinks{display:flex;flex-wrap:wrap;gap:12px}.sourceLinks a,.backBtn{display:inline-block;border:1px solid #a9957c;border-radius:999px;padding:10px 15px;text-decoration:none;font:15px system-ui,sans-serif;background:#fffaf3}.sourceLinks a:hover,.sourceLinks a:focus-visible,.backBtn:hover,.backBtn:focus-visible{background:#3c332d;color:white}
.coverZoom{position:absolute;right:9px;top:9px;border:0;border-radius:50%;width:34px;height:34px;background:rgb(255 255 255/.86);cursor:zoom-in;font:18px system-ui,sans-serif}.zoomed{--cover:230px}.compact{--cover:112px}.modal{position:fixed;inset:0;background:rgb(34 29 25/.78);display:none;place-items:center;padding:24px;z-index:30}.modal.open{display:grid}.modalCard{width:min(420px,85vw);position:relative}.modalCard .cover{min-height:min(72vh,650px)}.close{position:absolute;right:-10px;top:-10px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:white;font-size:24px;cursor:pointer}
.notice{font:13px system-ui,sans-serif;color:var(--muted);margin-top:60px}
@media(max-width:700px){body{font-size:17px}.shell{padding-inline:18px}.topbar{align-items:flex-start}.tag{display:none}.bookNav{position:sticky;top:8px;z-index:10;width:max-content;max-width:100%;padding:4px;border-radius:999px;background:rgb(247 243 236/.92);backdrop-filter:blur(8px);box-shadow:0 5px 18px rgb(59 43 30/.12)}.authorHero{grid-template-columns:88px 1fr}.portrait{width:88px;font-size:28px}.openBook{grid-template-columns:1fr}.heroCover{width:min(74vw,300px)}.books{gap:18px}.shelf{margin-bottom:44px}.shelfHead{align-items:center}.zoomed{--cover:68vw}.compact{--cover:38vw}:root{--cover:43vw}.lede{margin-bottom:34px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div class="modal" id="coverModal" role="dialog" aria-modal="true" aria-label="Portada ampliada"><div class="modalCard"><button class="close" aria-label="Cerrar">×</button><div id="modalCover"></div></div></div>
<script>
const AUTHORS={
 "michael-newton":{name:"Michael Newton",initials:"MN",intro:"Biblioteca de obras asociadas a Michael Newton. Prototipo de navegación por autor.",books:[
  {id:"journey-of-souls",title:"Journey of Souls",cover:"c2"},
  {id:"destiny-of-souls",title:"Destiny of Souls",cover:"c3"},
  {id:"life-between-lives",title:"Life Between Lives",cover:"c4"},
  {id:"memories-of-the-afterlife",title:"Memories of the Afterlife",cover:"c5"},
  {id:"wisdom-of-souls",title:"Wisdom of Souls",cover:"c1"},
  {id:"case-studies",title:"Case studies · prototipo",cover:"c6"}
 ]},
 "brian-weiss":{name:"Brian Weiss",initials:"BW",intro:"Ejemplo de un autor con solo dos obras en este prototipo.",books:[
  {id:"many-lives-many-masters",title:"Many Lives, Many Masters",cover:"c7"},
  {id:"through-time-into-healing",title:"Through Time into Healing",cover:"c1"}
 ]}
};
let density=localStorage.getItem("libraryDensity")||"standard";
const esc=s=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function cover(book,author,withZoom=false){
 return `<div class="cover ${book.cover}">${withZoom?'<button class="coverZoom" type="button" aria-label="Ampliar portada" data-zoom="'+esc(book.id)+'" data-author="'+esc(author)+'">⌕</button>':''}<b>${esc(book.title)}</b><small>${esc(AUTHORS[author].name)}<br>Portada provisional</small></div>`;
}
function bookCard(book,aid){return `<a class="book" href="#/libro/${aid}/${book.id}" aria-label="${esc(book.title)}, ${esc(AUTHORS[aid].name)}">${cover(book,aid)}<div class="bookTitle">${esc(book.title)}</div><div class="bookAuthor">${esc(AUTHORS[aid].name)}</div></a>`}
function header(){return `<header class="topbar"><a class="brand" href="#/biblioteca">miterapiaregresiva.com · laboratorio</a><span class="tag">Prototipo beta · no indexable</span></header>`}
function controls(){return `<div class="toolbar" aria-label="Tamaño de las portadas"><strong>Vista</strong>
 <button class="density" data-density="compact" aria-pressed="${density==="compact"}">Compacta</button>
 <button class="density" data-density="standard" aria-pressed="${density==="standard"}">Estándar</button>
 <button class="density" data-density="zoomed" aria-pressed="${density==="zoomed"}">Portadas grandes</button></div>`}
function general(){
 return header()+`<main><h1>Biblioteca</h1><p class="lede">Una biblioteca organizada por autores. Cada estante abre una colección; cada portada abre el libro.</p>${controls()}
 ${Object.entries(AUTHORS).map(([aid,a])=>`<section class="shelf"><div class="shelfHead"><h2><a href="#/autor/${aid}">${esc(a.name)}</a></h2><span class="count">${a.books.length} obras</span></div><div class="books ${density}" tabindex="0" aria-label="Libros de ${esc(a.name)}. Desplázate horizontalmente para ver más obras.">${a.books.map(b=>bookCard(b,aid)).join("")}</div><div class="shelfLine" aria-hidden="true"></div></section>`).join("")}
 <p class="notice">Prototipo funcional. Las cubiertas son marcadores visuales provisionales para evaluar arquitectura, densidad y navegación.</p></main>`;
}
function authorPage(aid){
 const a=AUTHORS[aid]; if(!a)return general();
 return header()+`<main><nav class="breadcrumbs"><a href="#/biblioteca">Biblioteca</a> › ${esc(a.name)}</nav>
 <section class="authorHero"><div class="portrait" aria-hidden="true">${esc(a.initials)}</div><div><h1>${esc(a.name)}</h1><p>${esc(a.intro)}</p></div></section>
 ${controls()}<section class="shelf"><div class="shelfHead"><h2>Su estante</h2><span class="count">Desliza para recorrerlo</span></div><div class="books ${density}" tabindex="0" aria-label="Libros de ${esc(a.name)}. Desplázate horizontalmente para ver más obras.">${a.books.map(b=>bookCard(b,aid)).join("")}</div><div class="shelfLine"></div></section>
 <a class="backBtn" href="#/biblioteca">← Volver a la biblioteca</a></main>`;
}
function bookPage(aid,bid){
 const a=AUTHORS[aid], b=a?.books.find(x=>x.id===bid); if(!a||!b)return general();
 const q=encodeURIComponent('"'+b.title+'" '+a.name);
 return header()+`<main><nav class="breadcrumbs"><a href="#/biblioteca">Biblioteca</a> › <a href="#/autor/${aid}">${esc(a.name)}</a> › ${esc(b.title)}</nav>
 <nav class="bookNav" aria-label="Navegación del libro"><a href="#/autor/${aid}">← Volver al estante</a><a href="#/biblioteca">Biblioteca</a></nav>
 <div class="openBook"><div class="heroCover">${cover(b,aid,true)}</div><article>
 <p class="bookMeta">Obra · ${esc(a.name)}</p><h1>${esc(b.title)}</h1>
 <p class="bookCopy">Esta vista prueba la experiencia de “abrir” una obra: la portada permanece presente, la información se lee con calma y la autoría vive en la solapa, sin convertir la página en una ficha técnica.</p>
 <details class="flap" open><summary>Solapa · sobre ${esc(a.name)}</summary><div class="flapInner"><div class="miniPortrait" aria-hidden="true">${esc(a.initials)}</div><div><strong>${esc(a.name)}</strong><p>Resumen breve del autor para mantener el contexto del libro sin duplicar su página completa.</p><a href="#/autor/${aid}">Explorar su biblioteca →</a></div></div></details>
 <section class="sources"><h2>Dónde encontrar este libro</h2><p>Accesos de prueba a las fuentes ya previstas para la biblioteca.</p><div class="sourceLinks">
 <a target="_blank" rel="noopener noreferrer" href="https://archive.org/search?query=${q}">Buscar en Internet Archive</a>
 <a target="_blank" rel="noopener noreferrer" href="https://red-bica.bibliotecadecanarias.org/OpacDiscovery/public/home">Buscar en BICA</a>
 </div></section>
 <p><a class="backBtn" href="#/autor/${aid}">← Volver al estante de ${esc(a.name)}</a></p>
 </article></div></main>`;
}
function render(){
 const p=location.hash.replace(/^#\//,"").split("/"); let html;
 if(p[0]==="autor")html=authorPage(p[1]); else if(p[0]==="libro")html=bookPage(p[1],p[2]); else html=general();
 document.getElementById("app").innerHTML=html;
 bind();
}
function bind(){
 document.querySelectorAll("[data-density]").forEach(btn=>btn.addEventListener("click",()=>{density=btn.dataset.density;localStorage.setItem("libraryDensity",density);render()}));
 document.querySelectorAll("[data-zoom]").forEach(btn=>btn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();const aid=btn.dataset.author,bid=btn.dataset.zoom,b=AUTHORS[aid].books.find(x=>x.id===bid);document.getElementById("modalCover").innerHTML=cover(b,aid);document.getElementById("coverModal").classList.add("open");document.querySelector(".close").focus()}));
 document.querySelectorAll(".books").forEach(row=>{
   row.addEventListener("wheel",e=>{
     if(row.scrollWidth<=row.clientWidth)return;
     if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
       e.preventDefault();
       row.scrollLeft+=e.deltaY;
     }
   },{passive:false});
   let dragging=false,startX=0,startLeft=0;
   row.addEventListener("pointerdown",e=>{
     if(e.pointerType==="touch")return;
     dragging=true; startX=e.clientX; startLeft=row.scrollLeft;
     row.setPointerCapture?.(e.pointerId);
   });
   row.addEventListener("pointermove",e=>{
     if(!dragging)return;
     row.scrollLeft=startLeft-(e.clientX-startX);
   });
   const stop=()=>{dragging=false};
   row.addEventListener("pointerup",stop);
   row.addEventListener("pointercancel",stop);
   row.addEventListener("keydown",e=>{
     if(e.key==="ArrowRight"){e.preventDefault();row.scrollBy({left:Math.max(160,row.clientWidth*.6),behavior:"smooth"})}
     if(e.key==="ArrowLeft"){e.preventDefault();row.scrollBy({left:-Math.max(160,row.clientWidth*.6),behavior:"smooth"})}
   });
 });
}
document.querySelector(".close").addEventListener("click",()=>document.getElementById("coverModal").classList.remove("open"));
document.getElementById("coverModal").addEventListener("click",e=>{if(e.target.id==="coverModal")e.currentTarget.classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("coverModal").classList.remove("open")});
window.addEventListener("hashchange",render);render();
</script>
</body></html>
