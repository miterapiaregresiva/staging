name: Staging structural integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate staging structure
        run: python scripts/audit_staging_integrity.py

      - name: Save machine-readable report
        if: always()
        run: python scripts/audit_staging_integrity.py --json > staging-integrity-report.json || true

      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-integrity-report
          path: staging-integrity-report.json

  compare-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Checkout production snapshot
        run: git clone --depth 1 https://github.com/miterapiaregresiva/miterapiaregresiva.github.io.git /tmp/mtr-production

      - name: Build route diff
        run: |
          python scripts/compare_staging_production.py /tmp/mtr-production \
            --json-out staging-production-routes.json \
            --md-out staging-production-routes.md

      - name: Show route diff
        run: cat staging-production-routes.md

      - name: Upload route diff
        uses: actions/upload-artifact@v4
        with:
          name: staging-production-route-diff
          path: |
            staging-production-routes.json
            staging-production-routes.md
