name: Staging indexing guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce noindex on every HTML file
        if: github.event_name != 'pull_request'
        run: python scripts/enforce_staging_noindex.py

      - name: Commit normalized anti-indexing metadata
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No anti-indexing changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Protect staging pages from search indexing"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Validate anti-indexing metadata
        run: python scripts/enforce_staging_noindex.py --check
