name: Staging indexing guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-indexing-guard-main
  cancel-in-progress: true

jobs:
  protect-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Sync latest main
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: git pull --rebase origin main

      - name: Enforce noindex on every HTML file
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: python scripts/enforce_staging_noindex.py

      - name: Commit normalized anti-indexing metadata
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No anti-indexing changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Protect staging pages from search indexing"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Validate anti-indexing metadata
        run: python scripts/enforce_staging_noindex.py --check
